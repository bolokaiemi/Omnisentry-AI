{% extends "base.html" %}

{% block title %}
Omnisentry AI - Threat Map
{% endblock %}

{% block head %}
<!-- Leaflet.js CSS and JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    #map-container {
        height: 600px;
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        border: 2px solid rgba(255,255,255,0.1);
        margin-top: 20px;
    }
    .map-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .map-card {
        background: rgba(255, 255, 255, 0.95);
        color: #222;
        padding: 15px;
        border-radius: 8px;
        font-family: inherit;
    }
    .map-card h4 {
        margin: 0 0 8px 0;
        font-size: 1.1rem;
        color: #1e3a8a;
    }
    .map-card p {
        margin: 4px 0;
        font-size: 0.9rem;
    }
    .btn-back {
        display: inline-block;
        padding: 10px 20px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .btn-back:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="map-header">
    <div>
        <h2>🌍 Location Intelligence Map</h2>
        <p class="subtitle">Scanned servers geolocation threat intelligence</p>
    </div>
    <a href="/" class="btn-back">🔙 Back to Scanner</a>
</div>

<div id="map-container"></div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Read lat, lon, domain, country, city, risk, score from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const lat = parseFloat(urlParams.get('lat')) || 0;
        const lon = parseFloat(urlParams.get('lon')) || 0;
        const domain = urlParams.get('domain') || 'Unknown Domain';
        const country = urlParams.get('country') || 'Unknown';
        const city = urlParams.get('city') || 'Unknown';
        const risk = urlParams.get('risk') || 'Unknown';
        const score = urlParams.get('score') || '0';
        const ip = urlParams.get('ip') || 'Unknown IP';
        const isp = urlParams.get('isp') || 'Unknown ISP';

        // Initialize Leaflet map
        const map = L.map('map-container').setView([lat, lon], lat === 0 && lon === 0 ? 2 : 6);

        // Add dark-mode themed openstreetmap tiles or standard cartodb tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        if (lat !== 0 || lon !== 0) {
            // Draw marker
            const markerColor = risk === 'SAFE' ? '#10B981' : 
                                risk === 'LOW RISK' ? '#84CC16' : 
                                risk === 'MEDIUM RISK' ? '#F59E0B' : 
                                risk === 'HIGH RISK' ? '#EF4444' : '#7F1D1D';

            const marker = L.marker([lat, lon]).addTo(map);
            
            const popupContent = `
                <div class="map-card">
                    <h4>🛡️ ${domain}</h4>
                    <p><strong>IP Address:</strong> ${ip}</p>
                    <p><strong>Location:</strong> ${city}, ${country}</p>
                    <p><strong>ISP:</strong> ${isp}</p>
                    <p><strong>Trust Score:</strong> ${score}/100</p>
                    <p><strong>Risk Level:</strong> <span style="color:${markerColor}; font-weight:bold">${risk}</span></p>
                </div>
            `;
            marker.bindPopup(popupContent).openPopup();
        }
    });
</script>
{% endblock %}
