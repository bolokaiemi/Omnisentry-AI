{% extends 'base.html' %}

{% block content %}
<div class="page-container" style="max-width: 480px; margin: 40px auto;">
    <div class="card glass-login-card" style="padding: 30px; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
        <h2>Reset Password</h2>
        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div style="margin-bottom: 15px;">
                <label for="password" style="display:block; margin-bottom:5px; color: var(--text-secondary);">New Password:</label>
                <input type="password" id="password" name="password" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); background: rgba(15,23,42,0.6); color:white;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="confirm" style="display:block; margin-bottom:5px; color: var(--text-secondary);">Confirm Password:</label>
                <input type="password" id="confirm" name="confirm" required style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); background: rgba(15,23,42,0.6); color:white;">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
        </form>
        <p style="margin-top:15px; text-align:center;"><a href="{{ url_for('login_page') }}" class="btn btn-secondary" style="margin-left:5px;">Back to Login</a></p>
    </div>
</div>
{% endblock %}
