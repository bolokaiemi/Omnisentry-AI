
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Omminsentiry AI Security Platform"
    >

    <title>
        {% block title %}
        Omminsentiry AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    {% block head %}
    {% endblock %}

</head>

<body>

    <div class="container">

        <header>

            <h1>
                🛡️ Omminsentiry AI
            </h1>

            <p class="subtitle">
                AI-Powered Website Trust Verification
            </p>

        </header>

        <main>

            {% block content %}
            {% endblock %}

        </main>

        <footer>

            <hr>

            <p>
                Omminsentiry AI Security Platform v0.1
            </p>

            <p>
                Website Trust • SSL Analysis • Reputation Checks
            </p>

        </footer>

    </div>

    {% block scripts %}
    {% endblock %}

</body>
